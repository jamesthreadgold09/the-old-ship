name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the deploy needs
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Turns Pages on (source = GitHub Actions) without a manual settings toggle
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build Astro site
        uses: withastro/action@v3
        with:
          node-version: 22
        # withastro/action installs deps, runs `astro build`, and uploads
        # ./dist as the Pages artifact.
        env:
          # The site is on its real domain, so search engines are allowed in.
          # This drops the `noindex` tag and switches robots.txt to "allow".
          # Must be the quoted string 'true' (see src/lib/urls.ts).
          PUBLIC_ALLOW_INDEX: 'true'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
